name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/master' }}

jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # PRs compare against their base; master pushes compare with the previous commit.
          base: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && github.event.before || github.event.repository.default_branch }}
          filters: |
            go:
              - '**/*.go'
            python:
              - '**/*.py'

  lint:
    name: Lint and compile (Windows amd64)
    needs: changes
    if: github.event_name == 'push' && github.ref != 'refs/heads/master' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.python == 'true')
    runs-on: windows-latest
    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: '0'
    steps:
      - name: Preserve repository line endings
        if: needs.changes.outputs.go == 'true'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: needs.changes.outputs.go == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go formatting
        if: needs.changes.outputs.go == 'true'
        shell: pwsh
        run: |
          $unformatted = @(gofmt -l cmd internal)
          if ($unformatted.Count -gt 0) {
            $unformatted | ForEach-Object { Write-Output $_ }
            throw 'Run gofmt on the files listed above.'
          }
      - name: Compile Go packages and tests without running tests
        if: needs.changes.outputs.go == 'true'
        run: go test -vet=off -run '^$' ./...
      - name: Vet backend packages
        if: needs.changes.outputs.go == 'true'
        run: go vet ./internal/discord ./internal/storage ./internal/presentation ./internal/demo ./internal/netdebug ./internal/gifplayer ./internal/gifsource
      - name: Vet native packages
        if: needs.changes.outputs.go == 'true'
        run: go vet -unsafeptr=false ./internal/ui ./internal/nativevideo ./cmd/discrud
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.python == 'true'
        with:
          python-version: '3.x'
      - name: Lint Python
        if: needs.changes.outputs.python == 'true'
        run: |
          python -m pip install ruff==0.11.13
          python -m ruff check --select E9,F63,F7,F82 .

  test:
    # Keep this job present on every PR: master branch protection requires this check.
    name: Test (Windows amd64)
    needs: changes
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: github.event_name == 'pull_request' && needs.changes.outputs.go == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        if: github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.python == 'true')
        with:
          python-version: '3.x'
      - name: Validate release version
        if: needs.changes.outputs.go == 'true'
        id: version
        shell: pwsh
        run: |
          $identity = Get-Content internal/discord/identity.go -Raw
          if ($identity -notmatch '(?m)^const ClientVersion = "(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"\s*$') {
            throw 'ClientVersion must be a stable MAJOR.MINOR.PATCH version.'
          }
          $version = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          git ls-remote --exit-code --tags origin "refs/tags/v$version"
          if ($LASTEXITCODE -eq 0) { throw "Tag v$version already exists; update ClientVersion before merging." }
          if ($LASTEXITCODE -ne 2) { throw 'Could not check existing release tags.' }
          $global:LASTEXITCODE = 0
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Run Go tests and vet
        if: github.event_name == 'pull_request' && needs.changes.outputs.go == 'true'
        run: python scripts/build.py --test
      - name: Lint Python
        if: github.event_name == 'pull_request' && needs.changes.outputs.python == 'true'
        run: |
          python -m pip install ruff==0.11.13
          python -m ruff check --select E9,F63,F7,F82 .

  build:
    name: Build Windows amd64 artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.changes.outputs.go == 'true'
    needs: [changes, test]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build executable and notices
        run: python scripts/build.py
      - name: Package release
        shell: pwsh
        run: |
          Compress-Archive -Path dist/discrud.exe,dist/Demo.cmd,dist/THIRD_PARTY_NOTICES.txt -DestinationPath "dist/discrud-v${{ needs.test.outputs.version }}-windows-amd64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: discrud-v${{ needs.test.outputs.version }}-windows-amd64
          path: dist/discrud-v${{ needs.test.outputs.version }}-windows-amd64.zip
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ needs.test.outputs.version }}" "dist/discrud-v${{ needs.test.outputs.version }}-windows-amd64.zip" --target "${{ github.sha }}" --title "Discrud v${{ needs.test.outputs.version }}" --generate-notes
